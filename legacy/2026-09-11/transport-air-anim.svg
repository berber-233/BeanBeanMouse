<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-label="BeanBeanMouse courier - air transport: hamster airship carrying cargo">
  <title>BeanBeanMouse courier - air transport</title>
  <defs>
    <linearGradient id="aSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CDE9FF"/>
      <stop offset="60%" stop-color="#EAF6FF"/>
      <stop offset="100%" stop-color="#FFF3D6"/>
    </linearGradient>
    <radialGradient id="aSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8DC"/>
      <stop offset="60%" stop-color="#FFE38E"/>
      <stop offset="100%" stop-color="#FFD34E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aEnv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD97A"/>
      <stop offset="55%" stop-color="#F6C453"/>
      <stop offset="100%" stop-color="#E5A63B"/>
    </linearGradient>
    <linearGradient id="aWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9894A"/>
      <stop offset="100%" stop-color="#9A5F2A"/>
    </linearGradient>
    <radialGradient id="aFur" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#F5BC62"/>
      <stop offset="100%" stop-color="#E0912F"/>
    </radialGradient>
    <linearGradient id="aScarf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D94A3A"/>
      <stop offset="100%" stop-color="#E5553D"/>
    </linearGradient>
    <clipPath id="aEnvClip">
      <ellipse cx="0" cy="78" rx="150" ry="56"/>
    </clipPath>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="800" height="240" fill="url(#aSky)"/>

  <!-- sun -->
  <g transform="translate(120 50)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.07;1" dur="4.2s" repeatCount="indefinite"/>
      <circle r="48" fill="url(#aSun)"/>
      <circle r="19" fill="#FFE38E"/>
    </g>
  </g>

  <!-- drifting clouds: back layer -->
  <g fill="#FFFFFF" opacity=".9">
    <g>
      <animateTransform attributeName="transform" type="translate" values="900 0;-260 0" dur="26s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="168" rx="62" ry="17"/>
      <ellipse cx="46" cy="158" rx="38" ry="14"/>
      <ellipse cx="-48" cy="160" rx="32" ry="12"/>
      <ellipse cx="340" cy="176" rx="70" ry="18"/>
      <ellipse cx="392" cy="166" rx="42" ry="14"/>
      <ellipse cx="294" cy="168" rx="34" ry="12"/>
      <ellipse cx="680" cy="172" rx="60" ry="16"/>
      <ellipse cx="726" cy="162" rx="36" ry="13"/>
      <ellipse cx="640" cy="164" rx="30" ry="11"/>
    </g>
  </g>
  <!-- drifting clouds: front layer -->
  <g fill="#FFFFFF" opacity=".96">
    <g>
      <animateTransform attributeName="transform" type="translate" values="940 0;-220 0" dur="17s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="52" rx="46" ry="14"/>
      <ellipse cx="36" cy="44" rx="30" ry="11"/>
      <ellipse cx="-32" cy="45" rx="24" ry="9"/>
      <ellipse cx="430" cy="60" rx="52" ry="15"/>
      <ellipse cx="472" cy="51" rx="32" ry="11"/>
      <ellipse cx="396" cy="52" rx="26" ry="9"/>
      <ellipse cx="760" cy="48" rx="42" ry="13"/>
      <ellipse cx="794" cy="41" rx="26" ry="10"/>
    </g>
  </g>

  <!-- birds -->
  <g stroke="#5A6B7A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g>
      <animateTransform attributeName="transform" type="translate" values="880 0;-80 0" dur="11s" repeatCount="indefinite"/>
      <g transform="translate(0 70)">
        <g>
          <animateTransform attributeName="transform" type="scale" values="1 1;1 .45;1 1" dur=".8s" repeatCount="indefinite"/>
          <path d="M0 0 Q 6 -9 14 -2 Q 9 -3 5 1 Q 3 -3 0 0 Z"/>
        </g>
      </g>
    </g>
  </g>

  <!-- landing pad (destination) -->
  <g>
    <path d="M700 216 Q 722 206 748 208 Q 774 206 792 216 L 792 222 L 700 222 Z" fill="#B97B3F" stroke="#8F5A27" stroke-width="2.5"/>
    <path d="M700 216 Q 722 206 748 208 Q 774 206 792 216 L 792 218 L 700 218 Z" fill="#E0B06A"/>
    <rect x="762" y="186" width="5" height="24" rx="2" fill="#8F5A27"/>
    <path d="M767 188 L784 181 L767 174 Z" fill="#4F9E4F">
      <animateTransform attributeName="transform" type="skewX" values="0;-8;0" dur=".9s" repeatCount="indefinite"/>
    </path>
    <ellipse cx="718" cy="218" rx="5" ry="3.4" fill="#E5553D"/>
    <ellipse cx="732" cy="218" rx="5" ry="3.4" fill="#F2B705"/>
    <ellipse cx="746" cy="218" rx="5" ry="3.4" fill="#FFF3D6"/>
  </g>

  <!-- arrival confetti -->
  <g>
    <rect x="722" y="120" width="7" height="7" rx="2" fill="#E5553D">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 44;0 44" keyTimes="0;.5;1" dur="2.3s" begin="8.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.2;.3;.72;.92;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <rect x="756" y="112" width="6" height="6" rx="2" fill="#F2B705">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 52;0 52" keyTimes="0;.5;1" dur="2.6s" begin="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.2;.3;.72;.92;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <circle cx="740" cy="108" r="3.2" fill="#4F9E4F">
      <animateTransform attributeName="transform" type="translate" values="0 0;-7 50;-7 50" keyTimes="0;.5;1" dur="2s" begin="9.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.2;.3;.72;.92;1" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ airship journey group ============ -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-50 0;-50 0;680 0;680 0;-50 0" keyTimes="0;.16;.72;.96;1" dur="12s" repeatCount="indefinite"/>
    <!-- float -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="2.8s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-1.2 0 78;1.2 0 78;-1.2 0 78" dur="4.2s" repeatCount="indefinite"/>

        <!-- envelope -->
        <g clip-path="url(#aEnvClip)">
          <rect x="-160" y="20" width="320" height="116" fill="url(#aEnv)"/>
          <rect x="-38" y="20" width="42" height="116" fill="#E5A63B" opacity=".55"/>
          <rect x="34" y="20" width="42" height="116" fill="#E5A63B" opacity=".55"/>
          <rect x="106" y="20" width="42" height="116" fill="#E5A63B" opacity=".55"/>
        </g>
        <ellipse cx="0" cy="78" rx="150" ry="56" fill="none" stroke="#C98A1E" stroke-width="3"/>
        <ellipse cx="-42" cy="48" rx="46" ry="18" fill="#FFFFFF" opacity=".35"/>

        <!-- fins -->
        <path d="M-140 42 L -196 12 L -168 64 Z" fill="#E5A63B" stroke="#C98A1E" stroke-width="2.5"/>
        <path d="M-140 114 L -196 144 L -168 92 Z" fill="#E5A63B" stroke="#C98A1E" stroke-width="2.5"/>
        <path d="M-140 78 L -202 62 L -178 92 Z" fill="#D9942E" stroke="#C98A1E" stroke-width="2.5"/>

        <!-- propeller -->
        <circle cx="-196" cy="78" r="7" fill="#8F5A27"/>
        <g fill="#C9894A" stroke="#8F5A27" stroke-width="1.5">
          <animateTransform attributeName="transform" type="rotate" values="0 -196 78;360 -196 78" dur=".45s" repeatCount="indefinite"/>
          <ellipse cx="-196" cy="62" rx="5" ry="12"/>
          <ellipse cx="-196" cy="94" rx="5" ry="12"/>
          <ellipse cx="-212" cy="78" rx="12" ry="5"/>
        </g>

        <!-- gondola -->
        <rect x="-46" y="126" width="92" height="42" rx="16" fill="url(#aWood)" stroke="#5F3A1B" stroke-width="3"/>
        <rect x="-46" y="126" width="92" height="12" rx="6" fill="#E0B06A"/>
        <circle cx="0" cy="147" r="12" fill="#CFE8F7" stroke="#5F3A1B" stroke-width="2.5"/>
        <!-- hamster pilot -->
        <g transform="translate(0 147)">
          <circle cx="-7" cy="-11" r="5" fill="url(#aFur)"/>
          <circle cx="7" cy="-11" r="5" fill="url(#aFur)"/>
          <ellipse cx="-7" cy="-10" r="2.5" fill="#F7C6A0"/>
          <ellipse cx="7" cy="-10" r="2.5" fill="#F7C6A0"/>
          <circle cx="0" cy="-1" r="10" fill="url(#aFur)"/>
          <circle cx="-4" cy="-5" r="2.6" fill="#FFFFFF"/>
          <circle cx="4" cy="-5" r="2.6" fill="#FFFFFF"/>
          <circle cx="-3.4" cy="-4.2" r="1.3" fill="#2B1B0E"/>
          <circle cx="3.4" cy="-4.2" r="1.3" fill="#2B1B0E"/>
          <ellipse cx="0" cy="-2" rx="1.4" ry="1.1" fill="#6B4A16"/>
          <path d="M-8 3 Q0 8 8 3" stroke="#6B4A16" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <path d="M-9 6 Q0 11 9 6 L8 10 Q0 15 -8 10 Z" fill="url(#aScarf)"/>
          <!-- waving paw -->
          <ellipse cx="9" cy="4" rx="3.4" ry="2.5" fill="#F5BC62">
            <animateTransform attributeName="transform" type="rotate" values="0 9 4;18 9 4;0 9 4" dur="1.2s" repeatCount="indefinite"/>
          </ellipse>
        </g>

        <!-- cargo net -->
        <g transform="translate(0 168)">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="-7;7;-7" dur="3s" repeatCount="indefinite"/>
            <path d="M-34 0 Q -52 14 -52 34 M-18 0 Q -28 14 -28 34 M18 0 Q 28 14 28 34 M34 0 Q 52 14 52 34" stroke="#8F5A27" stroke-width="2" fill="none"/>
            <rect x="-52" y="18" width="104" height="34" rx="7" fill="#D9A05F" stroke="#8F5A27" stroke-width="3"/>
            <rect x="-52" y="18" width="104" height="10" rx="5" fill="#EBC07E"/>
            <rect x="-8" y="18" width="8" height="34" fill="#8F5A27" opacity=".7"/>
            <rect x="18" y="18" width="8" height="34" fill="#8F5A27" opacity=".7"/>
            <rect x="-26" y="26" width="7" height="7" rx="2" fill="#E5553D" opacity=".8"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
