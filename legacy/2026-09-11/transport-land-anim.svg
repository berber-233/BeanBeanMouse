<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-label="BeanBeanMouse courier - land transport: hamster rides a horse cart with cargo">
  <title>BeanBeanMouse courier - land transport</title>
  <defs>
    <linearGradient id="lSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3C9"/>
      <stop offset="62%" stop-color="#FFE3A0"/>
      <stop offset="100%" stop-color="#FFD689"/>
    </linearGradient>
    <linearGradient id="lRoad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8A96F"/>
      <stop offset="100%" stop-color="#B9834C"/>
    </linearGradient>
    <radialGradient id="lSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7D0"/>
      <stop offset="60%" stop-color="#FFE58A"/>
      <stop offset="100%" stop-color="#FFD34E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9894A"/>
      <stop offset="100%" stop-color="#9A5F2A"/>
    </linearGradient>
    <linearGradient id="lHorse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A9743F"/>
      <stop offset="100%" stop-color="#7E4E25"/>
    </linearGradient>
    <radialGradient id="lFur" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#F5BC62"/>
      <stop offset="100%" stop-color="#E0912F"/>
    </radialGradient>
    <linearGradient id="lScarf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D94A3A"/>
      <stop offset="100%" stop-color="#E5553D"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="800" height="240" fill="url(#lSky)"/>

  <!-- sun -->
  <g transform="translate(668 46)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="4s" repeatCount="indefinite"/>
      <circle r="46" fill="url(#lSun)"/>
      <circle r="19" fill="#FFE08A"/>
    </g>
  </g>

  <!-- drifting clouds -->
  <g fill="#FFFDF4" opacity=".95">
    <g>
      <animateTransform attributeName="transform" type="translate" values="880 0;-160 0" dur="30s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="48" rx="44" ry="15"/>
      <ellipse cx="34" cy="40" rx="30" ry="13"/>
      <ellipse cx="-34" cy="41" rx="26" ry="11"/>
      <ellipse cx="340" cy="56" rx="52" ry="16"/>
      <ellipse cx="380" cy="47" rx="34" ry="13"/>
      <ellipse cx="305" cy="48" rx="28" ry="11"/>
      <ellipse cx="700" cy="44" rx="46" ry="14"/>
      <ellipse cx="738" cy="36" rx="30" ry="12"/>
      <ellipse cx="668" cy="37" rx="26" ry="10"/>
    </g>
  </g>

  <!-- hills & grass -->
  <path d="M0 176 Q 130 148 260 176 T 520 176 T 780 172 L800 176 L800 240 L0 240 Z" fill="#E9EEC7" opacity=".92"/>
  <rect x="0" y="192" width="800" height="10" fill="#DCE6AC"/>

  <!-- road -->
  <rect x="0" y="202" width="800" height="38" fill="url(#lRoad)"/>
  <rect x="0" y="202" width="800" height="3" fill="#FFF1D6" opacity=".55"/>
  <rect x="0" y="237" width="800" height="3" fill="#FFF1D6" opacity=".55"/>
  <!-- scrolling lane dashes -->
  <g fill="#FFF3DC" opacity=".78">
    <animateTransform attributeName="transform" type="translate" values="0 0;-80 0" dur="1.2s" repeatCount="indefinite"/>
    <rect x="-80" y="219" width="40" height="5" rx="2.5"/>
    <rect x="0" y="219" width="40" height="5" rx="2.5"/>
    <rect x="80" y="219" width="40" height="5" rx="2.5"/>
    <rect x="160" y="219" width="40" height="5" rx="2.5"/>
    <rect x="240" y="219" width="40" height="5" rx="2.5"/>
    <rect x="320" y="219" width="40" height="5" rx="2.5"/>
    <rect x="400" y="219" width="40" height="5" rx="2.5"/>
    <rect x="480" y="219" width="40" height="5" rx="2.5"/>
    <rect x="560" y="219" width="40" height="5" rx="2.5"/>
    <rect x="640" y="219" width="40" height="5" rx="2.5"/>
    <rect x="720" y="219" width="40" height="5" rx="2.5"/>
    <rect x="800" y="219" width="40" height="5" rx="2.5"/>
  </g>

  <!-- start signpost -->
  <g>
    <rect x="46" y="118" width="7" height="80" rx="3" fill="#8F5A27"/>
    <rect x="18" y="96" width="64" height="34" rx="9" fill="#C9894A" stroke="#8F5A27" stroke-width="2.5"/>
    <ellipse cx="38" cy="113" rx="5" ry="4" fill="#FFF3DC"/>
    <ellipse cx="50" cy="113" rx="5" ry="4" fill="#FFF3DC"/>
    <ellipse cx="62" cy="113" rx="5" ry="4" fill="#FFF3DC"/>
    <path d="M49 118 L68 109 L49 100 Z" fill="#E5553D">
      <animateTransform attributeName="transform" type="skewX" values="0;-10;0" dur=".9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- destination signpost -->
  <g>
    <rect x="758" y="84" width="7" height="112" rx="3" fill="#8F5A27"/>
    <rect x="726" y="196" width="70" height="8" rx="4" fill="#9A5F2A"/>
    <path d="M761 84 L782 74 L761 64 Z" fill="#4F9E4F">
      <animateTransform attributeName="transform" type="skewX" values="0;-10;0" dur=".8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- arrival confetti -->
  <g>
    <rect x="700" y="42" width="7" height="7" rx="2" fill="#E5553D">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 52;0 52" keyTimes="0;.5;1" dur="2.4s" begin="8.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.2;.3;.72;.92;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <rect x="736" y="30" width="6" height="6" rx="2" fill="#F2B705">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 60;0 60" keyTimes="0;.5;1" dur="2.1s" begin="9.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.2;.3;.72;.92;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <rect x="772" y="36" width="6" height="6" rx="2" fill="#4F9E4F">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 48;0 48" keyTimes="0;.5;1" dur="2.6s" begin="8.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.2;.3;.72;.92;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <circle cx="754" cy="26" r="3" fill="#E0912F">
      <animateTransform attributeName="transform" type="translate" values="0 0;-8 58;-8 58" keyTimes="0;.5;1" dur="2s" begin="9.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.2;.3;.72;.92;1" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- motion lines (visible while travelling) -->
  <g stroke="#FFF6E0" stroke-width="4" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" values="0;0;.7;.7;0;0" keyTimes="0;.2;.32;.66;.76;1" dur="12s" repeatCount="indefinite"/>
    <line x1="30" y1="150" x2="86" y2="150"/>
    <line x1="16" y1="166" x2="70" y2="166"/>
    <line x1="44" y1="182" x2="94" y2="182"/>
  </g>

  <!-- ============ horse + cart journey group ============ -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-60 0;-60 0;470 0;470 0;-60 0" keyTimes="0;.16;.72;.96;1" dur="12s" repeatCount="indefinite"/>

    <!-- cart bounce -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 170 190;.8 170 190;0 170 190;-.8 170 190;0 170 190" keyTimes="0;.25;.5;.75;1" dur=".55s" repeatCount="indefinite"/>

      <!-- dust puffs -->
      <g fill="#E9D7B5">
        <circle cx="66" cy="196" r="7">
          <animate attributeName="opacity" values="0;0;.85;.45;0" keyTimes="0;.2;.42;.62;1" dur="12s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;-8 -6;-20 -12" keyTimes="0;.5;1" dur="1.1s" begin="2.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="196" cy="196" r="6">
          <animate attributeName="opacity" values="0;0;.75;.4;0" keyTimes="0;.2;.46;.64;1" dur="12s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;-8 -6;-20 -12" keyTimes="0;.5;1" dur="1.2s" begin="2.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="120" cy="198" r="5">
          <animate attributeName="opacity" values="0;0;.65;.3;0" keyTimes="0;.2;.44;.63;1" dur="12s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;-8 -6;-20 -12" keyTimes="0;.5;1" dur=".9s" begin="2.5s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- cart wheels -->
      <circle cx="80" cy="188" r="27" fill="#6B4A16"/>
      <circle cx="180" cy="188" r="27" fill="#6B4A16"/>
      <circle cx="80" cy="188" r="9" fill="#C9894A"/>
      <circle cx="180" cy="188" r="9" fill="#C9894A"/>
      <g stroke="#C9894A" stroke-width="5" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="0 80 188;0 80 188;1080 80 188;1080 80 188;0 80 188" keyTimes="0;.16;.72;.96;1" dur="12s" repeatCount="indefinite"/>
        <line x1="80" y1="168" x2="80" y2="208"/>
        <line x1="60" y1="188" x2="100" y2="188"/>
      </g>
      <g stroke="#C9894A" stroke-width="5" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="0 180 188;0 180 188;1080 180 188;1080 180 188;0 180 188" keyTimes="0;.16;.72;.96;1" dur="12s" repeatCount="indefinite"/>
        <line x1="180" y1="168" x2="180" y2="208"/>
        <line x1="160" y1="188" x2="200" y2="188"/>
      </g>

      <!-- cart body -->
      <rect x="30" y="104" width="172" height="72" rx="15" fill="url(#lWood)" stroke="#6B4A16" stroke-width="3"/>
      <rect x="30" y="104" width="172" height="15" rx="7" fill="#E0B06A" stroke="#6B4A16" stroke-width="2.5"/>
      <circle cx="116" cy="142" r="15" fill="#E0B06A" stroke="#6B4A16" stroke-width="2.5"/>
      <ellipse cx="110" cy="139" rx="4" ry="3.4" fill="#FFF3DC"/>
      <ellipse cx="118" cy="139" rx="4" ry="3.4" fill="#FFF3DC"/>
      <ellipse cx="126" cy="139" rx="4" ry="3.4" fill="#FFF3DC"/>
      <ellipse cx="116" cy="147" rx="6" ry="4" fill="#FFF3DC"/>

      <!-- cargo crates on cart -->
      <rect x="52" y="58" width="124" height="44" rx="8" fill="#D9A05F" stroke="#8F5A27" stroke-width="3"/>
      <rect x="52" y="58" width="124" height="12" rx="6" fill="#EBC07E"/>
      <rect x="104" y="58" width="9" height="44" fill="#8F5A27" opacity=".75"/>
      <rect x="116" y="58" width="9" height="44" fill="#8F5A27" opacity=".75"/>
      <rect x="84" y="72" width="10" height="10" rx="2" fill="#8F5A27" opacity=".55"/>
      <circle cx="114" cy="52" r="8" fill="#E5553D"/>
      <circle cx="114" cy="52" r="3" fill="#FFF3DC"/>

      <!-- cart flag -->
      <rect x="40" y="52" width="5" height="52" rx="2" fill="#8F5A27"/>
      <path d="M45 54 L68 44 L45 34 Z" fill="#E5553D">
        <animateTransform attributeName="transform" type="skewX" values="0;-9;0" dur=".8s" repeatCount="indefinite"/>
      </path>

      <!-- hamster driver -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur=".7s" repeatCount="indefinite"/>
        <circle cx="222" cy="92" r="9" fill="url(#lFur)"/>
        <circle cx="215" cy="84" r="9" fill="url(#lFur)"/>
        <ellipse cx="213" cy="86" r="4.5" fill="#F7C6A0"/>
        <circle cx="222" cy="92" r="24" fill="url(#lFur)"/>
        <ellipse cx="212" cy="98" rx="6" ry="4.4" fill="#F8A79B" opacity=".6"/>
        <ellipse cx="233" cy="98" rx="6" ry="4.4" fill="#F8A79B" opacity=".6"/>
        <circle cx="212" cy="82" r="5.4" fill="#FFFFFF"/>
        <circle cx="233" cy="82" r="5.4" fill="#FFFFFF"/>
        <circle cx="213.6" cy="83.2" r="2.6" fill="#2B1B0E"/>
        <circle cx="231.4" cy="83.2" r="2.6" fill="#2B1B0E"/>
        <circle cx="214.8" cy="81.6" r="1" fill="#FFFFFF"/>
        <circle cx="230.2" cy="81.6" r="1" fill="#FFFFFF"/>
        <ellipse cx="222" cy="90.5" rx="2.6" ry="2.1" fill="#6B4A16"/>
        <path d="M222 92.6 L222 96 M222 96 Q219 99 216 98" stroke="#6B4A16" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path d="M198 106 Q222 116 246 106 L244 115 Q222 124 200 115 Z" fill="url(#lScarf)"/>
        <!-- waving paw holding reins -->
        <ellipse cx="247" cy="104" rx="7" ry="5" fill="#F5BC62" stroke="#E0912F" stroke-width="1.5">
          <animateTransform attributeName="transform" type="rotate" values="0 247 104;14 247 104;0 247 104" dur="1.1s" repeatCount="indefinite"/>
        </ellipse>
      </g>

      <!-- reins -->
      <path d="M250 105 Q292 96 318 112" stroke="#6B4A16" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>

    <!-- horse -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 240 150;1.2 240 150;0 240 150;-1.2 240 150;0 240 150" keyTimes="0;.25;.5;.75;1" dur=".6s" repeatCount="indefinite"/>
      <!-- tail -->
      <path d="M176 128 Q 156 116 152 136 Q 148 154 162 160" stroke="#5F3A1B" stroke-width="9" fill="none" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="0 176 128;10 176 128;0 176 128;-8 176 128;0 176 128" keyTimes="0;.25;.5;.75;1" dur=".7s" repeatCount="indefinite"/>
      </path>
      <!-- back legs -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 212 178;24 212 178;0 212 178;-24 212 178;0 212 178" keyTimes="0;.25;.5;.75;1" dur=".55s" repeatCount="indefinite"/>
        <rect x="204" y="178" width="15" height="26" rx="7" fill="url(#lHorse)"/>
        <rect x="204" y="198" width="15" height="8" rx="4" fill="#5F3A1B"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 232 178;-22 232 178;0 232 178;22 232 178;0 232 178" keyTimes="0;.25;.5;.75;1" dur=".55s" repeatCount="indefinite"/>
        <rect x="225" y="178" width="15" height="26" rx="7" fill="url(#lHorse)"/>
        <rect x="225" y="198" width="15" height="8" rx="4" fill="#5F3A1B"/>
      </g>
      <!-- body -->
      <ellipse cx="252" cy="148" rx="76" ry="40" fill="url(#lHorse)"/>
      <ellipse cx="252" cy="162" rx="50" ry="20" fill="#C08A52" opacity=".65"/>
      <!-- front legs -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 296 178;-22 296 178;0 296 178;22 296 178;0 296 178" keyTimes="0;.25;.5;.75;1" dur=".55s" repeatCount="indefinite"/>
        <rect x="289" y="178" width="15" height="26" rx="7" fill="url(#lHorse)"/>
        <rect x="289" y="198" width="15" height="8" rx="4" fill="#5F3A1B"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 312 178;24 312 178;0 312 178;-24 312 178;0 312 178" keyTimes="0;.25;.5;.75;1" dur=".55s" repeatCount="indefinite"/>
        <rect x="305" y="178" width="15" height="26" rx="7" fill="url(#lHorse)"/>
        <rect x="305" y="198" width="15" height="8" rx="4" fill="#5F3A1B"/>
      </g>
      <!-- neck & head -->
      <path d="M296 128 Q 322 104 336 92 L 322 80 Q 304 98 286 116 Z" fill="url(#lHorse)"/>
      <ellipse cx="330" cy="86" rx="26" ry="21" fill="url(#lHorse)"/>
      <ellipse cx="346" cy="96" rx="12" ry="9" fill="#C08A52"/>
      <circle cx="338" cy="86" r="5.5" fill="#2B1B0E"/>
      <circle cx="354" cy="86" r="5.5" fill="#2B1B0E"/>
      <circle cx="339.5" cy="84.4" r="1.7" fill="#FFFFFF"/>
      <circle cx="352.5" cy="84.4" r="1.7" fill="#FFFFFF"/>
      <ellipse cx="342" cy="97" rx="4" ry="3" fill="#5F3A1B"/>
      <path d="M312 68 Q 320 56 332 62" stroke="#5F3A1B" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M324 62 Q 330 52 340 57" stroke="#5F3A1B" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse cx="330" cy="68" rx="8" ry="12" fill="#5F3A1B"/>
      <ellipse cx="348" cy="66" rx="8" ry="12" fill="#5F3A1B"/>
      <!-- harness -->
      <path d="M318 100 L 330 130 L 306 132 Z" fill="#E5553D" opacity=".9"/>
    </g>
  </g>
</svg>
