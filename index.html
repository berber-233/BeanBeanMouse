<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeanBeanMouse | Global B2B Trade Platform</title>
  <meta name="description" content="BeanBeanMouse connects global buyers with trusted suppliers — publish products, filter precisely, send inquiries and trade across borders in 25+ languages.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://beanbeanmouse.com/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BeanBeanMouse">
  <meta property="og:title" content="BeanBeanMouse | Global B2B Trade Platform">
  <meta property="og:description" content="Connecting global buyers with trusted suppliers. Browse, compare and inquire in your own language.">
  <meta property="og:url" content="https://beanbeanmouse.com/">
  <meta property="og:image" content="https://beanbeanmouse.com/assets/mascot-vector.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="BeanBeanMouse | Global B2B Trade Platform">
  <meta name="twitter:description" content="Connecting global buyers with trusted suppliers.">
  <meta name="twitter:image" content="https://beanbeanmouse.com/assets/mascot-vector.png">
  <link rel="icon" href="assets/mascot-vector.png">
  <link rel="apple-touch-icon" href="assets/mascot-vector.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <a class="brand" href="#/" data-nav="/">
        <span class="brand-mark" aria-hidden="true">
          <img src="assets/mascot-vector.svg" alt="" width="24" height="24" class="brand-mark-img">
        </span>
        <span class="brand-name">BeanBean<span>Mouse</span></span>
      </a>
      <nav class="main-nav" aria-label="主导航">
        <a href="#/" data-nav="/" data-i18n="home">首页</a>
        <a href="#/products" data-nav="/products" data-i18n="marketplace">产品市场</a>
        <a href="#/news" data-nav="/news" data-i18n="navNews">贸易资讯</a>
        <a href="#/guide" data-nav="/guide" data-i18n="navGuide">Trade process guide</a>
        <a href="#/dashboard" data-nav="/dashboard" data-i18n="dashboard">工作台</a>
      </nav>
      <div class="header-actions">
        <div id="langSwitch" class="lang-switch-wrap" aria-label="Language"></div>
        <a class="icon-btn fav-link" href="#/dashboard" data-nav="/dashboard" id="favBtn" title="收藏" aria-label="收藏">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7z"/></svg>
          <span class="fav-count" id="favCount" hidden>0</span>
        </a>
        <div id="userArea" class="user-area"></div>
      </div>
    </div>
  </header>

  <main id="app" class="app"></main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="brand-name brand-name--footer">BeanBean<span>Mouse</span></span>
        <p data-i18n="footerTagline">连接全球买家与优质供应商的 B2B 贸易平台（演示原型）</p>
      </div>
      <div class="footer-links">
        <a href="#/products" data-nav="/products" data-i18n="marketplace">产品市场</a>
        <a href="#/news" data-nav="/news" data-i18n="navNews">贸易资讯</a>
        <a href="#/guide" data-nav="/guide" data-i18n="navGuide">Trade process guide</a>
        <a href="#/customs" data-nav="/customs" data-i18n="navCustoms">Customs guide</a>
        <a href="#/recruit" data-nav="/recruit" data-i18n="navRecruit">Sell with us</a>
        <a href="#/dashboard" data-nav="/dashboard" data-i18n="dashboard">工作台</a>
        <a href="#/login" data-nav="/login" data-i18n="login">登录</a>
        <button type="button" class="footer-link" data-action="legal-note" data-i18n="userAgreement">用户协议</button>
        <button type="button" class="footer-link" data-action="legal-note" data-i18n="privacyPolicy">隐私政策</button>
        <button type="button" class="footer-link" data-action="legal-note" data-i18n="reportAbuse">违规举报</button>
        <button type="button" class="footer-link" data-action="fake-check" data-i18n="fakeCheck">防伪查询</button>
        <button type="button" class="footer-link" data-action="site-verify" data-i18n="verifySite">验证本站真伪</button>
      </div>
      <p class="footer-rights" data-i18n="rights">© 2026 BeanBeanMouse 演示原型 · 仅用于设计演示</p>
    </div>
  </footer>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <div id="printDoc" class="print-only" aria-hidden="true"></div>

  <div id="helpWidget" class="help-widget">
    <div class="help-panel" id="helpPanel" hidden>
      <div class="help-head">
        <img src="assets/mascot-vector.svg" alt="" width="34" height="34" class="help-head-img">
        <span class="help-title" id="helpTitle">网站使用帮助</span>
        <button type="button" class="modal-x help-close" data-action="close-help" aria-label="Close">✕</button>
      </div>
      <div class="help-body" id="helpBody"></div>
    </div>
    <button type="button" class="help-btn" data-action="toggle-help" title="网站使用帮助" aria-label="网站使用帮助" aria-expanded="false">
      <img src="assets/mascot-vector.svg" alt="BeanBeanMouse help" width="64" height="64">
      <span class="help-badge">?</span>
    </button>
  </div>

  <script src="data.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
