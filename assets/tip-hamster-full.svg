<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Hamster with bowl full of coins">
  <defs>
    <radialGradient id="fur" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#F5BC62"/>
      <stop offset="100%" stop-color="#E0912F"/>
    </radialGradient>
    <linearGradient id="scarf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D94A3A"/>
      <stop offset="100%" stop-color="#E5553D"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C98A4B"/>
      <stop offset="100%" stop-color="#9A5F2A"/>
