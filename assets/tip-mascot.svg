<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="120" height="120" role="img" aria-label="BeanBeanMouse tip hamster">
  <!-- 耳朵 -->
  <circle cx="72" cy="54" r="18" fill="#FFF6E8" stroke="#26304A" stroke-width="5"/>
  <circle cx="72" cy="54" r="9" fill="#FFB9C4"/>
  <circle cx="128" cy="54" r="18" fill="#FFF6E8" stroke="#26304A" stroke-width="5"/>
  <circle cx="128" cy="54" r="9" fill="#FFB9C4"/>
  <!-- 身体 -->
  <ellipse cx="100" cy="118" rx="50" ry="42" fill="#FFF6E8" stroke="#26304A" stroke-width="5"/>
  <!-- 头 -->
  <circle cx="100" cy="84" r="40" fill="#FFF6E8" stroke="#26304A" stroke-width="5"/>
  <!-- 腮红 -->
  <circle cx="78" cy="96" r="10" fill="#FFB9C4" opacity=".85"/>
  <circle cx="122" cy="96" r="10" fill="#FFB9C4" opacity=".85"/>
  <!-- 眼睛 -->
  <ellipse cx="85" cy="80" rx="6" ry="8" fill="#26304A"/>
  <ellipse cx="115" cy="80" rx="6" ry="8" fill="#26304A"/>
  <circle cx="87.5" cy="77" r="2.2" fill="#fff"/>
  <circle cx="117.5" cy="77" r="2.2" fill="#fff"/>
  <!-- 鼻子嘴 -->
  <ellipse cx="100" cy="90" rx="3.4" ry="2.8" fill="#E8888E"/>
  <path d="M100 93 Q95.5 99 91 97" fill="none" stroke="#26304A" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M100 93 Q104.5 99 109 97" fill="none" stroke="#26304A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 脚 -->
  <ellipse cx="82" cy="154" rx="13" ry="7" fill="#FFF6E8" stroke="#26304A" stroke-width="4"/>
  <ellipse cx="118" cy="154" rx="13" ry="7" fill="#FFF6E8" stroke="#26304A" stroke-width="4"/>
  <!-- 手臂（捧碗） -->
  <path d="M66 112 Q58 130 80 136" fill="none" stroke="#26304A" stroke-width="6" stroke-linecap="round"/>
  <path d="M134 112 Q142 130 120 136" fill="none" stroke="#26304A" stroke-width="6" stroke-linecap="round"/>
  <!-- 碗 -->
  <path d="M80 138 Q100 154 120 138 L112 156 Q100 164 88 156 Z" fill="#EAC9A0" stroke="#26304A" stroke-width="4" stroke-linejoin="round"/>
  <!-- 碗里的小费金币 -->
  <circle cx="100" cy="146" r="9" fill="#F59E0B" stroke="#26304A" stroke-width="3"/>
  <text x="100" y="150" font-size="11" font-weight="700" text-anchor="middle" fill="#7A4B00">¢</text>
</svg>
