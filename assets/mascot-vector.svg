<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="BeanBeanMouse hamster mascot">
  <defs>
    <radialGradient id="fur" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#F5BC62"/>
      <stop offset="100%" stop-color="#E0912F"/>
    </radialGradient>
    <linearGradient id="scarf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D94A3A"/>
      <stop offset="100%" stop-color="#E5553D"/>
    </linearGradient>
  </defs>
  <!-- ears -->
  <circle cx="52" cy="62" r="21" fill="url(#fur)"/>
  <circle cx="148" cy="62" r="21" fill="url(#fur)"/>
  <circle cx="54" cy="66" r="11" fill="#F7C6A0"/>
  <circle cx="146" cy="66" r="11" fill="#F7C6A0"/>
  <!-- body -->
  <circle cx="100" cy="118" r="62" fill="url(#fur)"/>
  <ellipse cx="100" cy="138" rx="44" ry="31" fill="#FFF6E3"/>
  <!-- blush -->
  <ellipse cx="66" cy="126" rx="11" ry="8" fill="#F8A79B" opacity=".55"/>
  <ellipse cx="134" cy="126" rx="11" ry="8" fill="#F8A79B" opacity=".55"/>
  <!-- eyes -->
  <circle cx="79" cy="104" r="12" fill="#FFFFFF"/>
  <circle cx="121" cy="104" r="12" fill="#FFFFFF"/>
  <circle cx="82" cy="107" r="6" fill="#2B1B0E"/>
  <circle cx="118" cy="107" r="6" fill="#2B1B0E"/>
  <circle cx="84" cy="104" r="2.2" fill="#FFFFFF"/>
  <circle cx="120" cy="104" r="2.2" fill="#FFFFFF"/>
  <!-- nose & mouth -->
  <ellipse cx="100" cy="117" rx="5" ry="4" fill="#6B4A16"/>
  <path d="M88 127 Q100 136 112 127" stroke="#6B4A16" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M95 118 v6 M105 118 v6" stroke="#6B4A16" stroke-width="2.5" stroke-linecap="round"/>
  <!-- scarf -->
  <path d="M48 146 Q100 168 152 146 L152 157 Q100 179 48 157 Z" fill="url(#scarf)"/>
  <rect x="140" y="149" width="16" height="30" rx="6" fill="url(#scarf)"/>
  <rect x="142" y="162" width="12" height="4" rx="2" fill="#F7C6A0" opacity=".9"/>
</svg>
