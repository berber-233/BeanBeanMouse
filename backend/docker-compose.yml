services:
  backend:
    build: .
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      JWT_SECRET: ${JWT_SECRET:-please-change-me-in-production}
      TRANSLATION_DAILY_QUOTA: ${TRANSLATION_DAILY_QUOTA:-5000}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-chain}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-mock}
      UPLOAD_DIR: /app/uploads
    volumes:
      - backend-data:/app/db
      - backend-uploads:/app/uploads
    restart: unless-stopped

  # 生产推荐：前置 nginx/Caddy 做 HTTPS 与静态前端托管
  # web:
  #   image: nginx:alpine
  #   ports: ["80:80", "443:443"]
  #   volumes:
  #     - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - ../:/usr/share/nginx/html:ro
  #   depends_on: [backend]

volumes:
  backend-data:
  backend-uploads:
