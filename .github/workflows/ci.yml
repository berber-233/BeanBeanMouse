name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check app.js
          node --check api.js
          node --check data.js
          node --check backend/src/server.mjs
          node --check backend/src/mailer.mjs
      - name: Backend API tests
        run: node backend/test/api.test.mjs
      - name: Backend SMTP tests
        run: node backend/test/smtp.test.mjs
      - name: Backend WebSocket tests
        run: node backend/test/ws.test.mjs
      - name: Consistency check (sitemap / redirects / build manifest)
        run: node scripts/check-consistency.mjs
      - name: Build static site
        run: node scripts/build-site.mjs
      - name: Verify dist output
        run: test -f dist/index.html && test -f dist/assets/mascot-vector.svg && test -f dist/_redirects && echo "dist OK"

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend API smoke
        run: node test/api-smoke.cjs
      - name: Frontend page regression
        run: node test/verify.cjs
